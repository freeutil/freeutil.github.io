<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="로또 번호 자동 생성기. 1부터 45까지 중복 없는 로또 번호를 1~5줄까지 간편하게 생성해보세요." />
    <meta name="keywords" content="로또 번호 자동 생성기, 로또 번호 생성, 로또 자동 번호, 로또 번호 추천, 로또 6/45" />
    <title>Free Util · 로또 번호 자동 생성기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>.hero h1{letter-spacing:-.03em}</style>
    <style>.brand-mark{width:18px;height:18px;border-radius:0;background:linear-gradient(var(--green) 0 0) 0 12px/6px 6px no-repeat,linear-gradient(var(--green) 0 0) 6px 6px/6px 6px no-repeat,linear-gradient(var(--green) 0 0) 12px 0/6px 6px no-repeat}</style>
    <style>.brand{gap:5px}</style>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="../" aria-label="Free Util home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Free Util</span>
        </a>
      </header>

      <section class="hero">
        <h1>로또 번호 자동 생성기</h1>
        <p>1부터 45까지 중복 없는 번호 6개를 자동으로 생성합니다.</p>
      </section>

      <section class="generator-card" aria-labelledby="generator-title">
        <div class="card-heading">
          <div>
            <span class="mini-label">YOUR LUCKY NUMBERS</span>
            <h2 id="generator-title">행운 번호 생성</h2>
          </div>
        </div>

        <div id="numberSets" class="number-sets" aria-live="polite"></div>

        <div class="actions">
          <label class="count-control" for="setCount">생성 줄 수
            <select id="setCount">
              <option value="1" selected>1줄</option>
              <option value="2">2줄</option>
              <option value="3">3줄</option>
              <option value="4">4줄</option>
              <option value="5">5줄</option>
            </select>
          </label>
          <button class="primary-button" id="generateButton" type="button"><span>번호 뽑기</span></button>
        </div>
      </section>

      <footer><span>행운은 준비된 마음에 찾아옵니다.</span><span>© lucky pick</span></footer>
    </main>
    <div class="toast" id="toast" role="status">번호를 복사했어요.</div>
    <script src="script.js?v=2"></script>
  </body>
</html>
