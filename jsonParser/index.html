<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FreeUtil JSON 파서. JSON 데이터를 검증하고 보기 좋게 정렬하거나 압축해보세요.">
  <title>FreeUtil · JSON 파서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="../"><span class="brand-mark">✦</span> FreeUtil</a><span class="tool-tag">DEVELOPER TOOL</span></header>
    <section class="hero"><p class="eyebrow">JSON · PARSER &amp; FORMATTER</p><h1>JSON을 더 <em>읽기 쉽게.</em></h1><p>JSON 데이터를 검증하고, 정렬하고, 트리 구조로 한눈에 확인하세요.</p></section>
    <section class="workspace" aria-label="JSON 파서">
      <div class="panel input-panel">
        <div class="panel-head"><div><span class="panel-label">INPUT</span><h2>JSON 입력</h2></div><button class="ghost-button" id="exampleButton" type="button">예제 불러오기</button></div>
        <textarea id="jsonInput" spellcheck="false" placeholder="JSON 데이터를 여기에 붙여넣으세요."></textarea>
        <div class="panel-foot"><span id="charCount">0자</span><button class="clear-button" id="clearButton" type="button">지우기</button></div>
      </div>
      <div class="toolbar"><button class="primary-button" id="parseButton" type="button">JSON 분석하기 <span>→</span></button><div class="tool-actions"><button id="formatButton" type="button">보기 좋게</button><button id="minifyButton" type="button">압축하기</button></div></div>
      <div id="message" class="message" role="status"></div>
      <div class="panel output-panel"><div class="panel-head"><div><span class="panel-label">RESULT</span><h2>구조 미리보기</h2></div><button class="ghost-button" id="copyButton" type="button">결과 복사</button></div><div id="output" class="output empty">JSON을 분석하면 결과가 표시됩니다.</div></div>
    </section>
    <footer><span>FreeUtil · 간단하고 유용한 웹 도구</span><span>JSON은 브라우저에서만 처리됩니다.</span></footer>
  </main>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
