<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="공백 포함·제외 글자 수와 UTF-8 바이트를 실시간으로 계산하는 무료 글자 수 세기 도구입니다.">
  <title>Free Util · 글자 수 세기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://freeutil.github.io/textCount/">
  <style>.hero h1{letter-spacing:-.03em}</style>
  <style>.brand-mark{width:18px;height:18px;border-radius:0;background:linear-gradient(var(--accent) 0 0) 0 12px/6px 6px no-repeat,linear-gradient(var(--accent) 0 0) 6px 6px/6px 6px no-repeat,linear-gradient(var(--accent) 0 0) 12px 0/6px 6px no-repeat}</style>
  <style>.brand{gap:5px}.toolbar button:disabled{color:#b8c2be;cursor:default}</style>
  <style>:root{--line:#c1cfca}</style>
  <style>.brand-mark{background:#e63946!important;clip-path:polygon(20% 0,40% 0,40% 20%,60% 20%,60% 0,80% 0,80% 20%,100% 20%,100% 60%,80% 60%,80% 80%,60% 80%,60% 100%,40% 100%,40% 80%,20% 80%,20% 60%,0 60%,0 20%,20% 20%);border-radius:0!important}</style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="../" aria-label="Free Util home"><span class="brand-mark" aria-hidden="true"></span> Free Util</a></header>
    <section class="hero"><h1 id="title">글자 수 세기</h1><p id="tagline">공백 포함·제외 글자 수와 바이트를 계산합니다.</p></section>
    <section class="workspace">
      <div class="toolbar"><span id="inputLabel">텍스트 입력</span><div><button id="copyButton" type="button" disabled>전체 복사</button><button id="clearButton" type="button">전체 지우기</button></div></div>
      <textarea id="textInput" placeholder="텍스트를 입력하거나 붙여넣으세요." spellcheck="false"></textarea>
      <div class="stats" aria-live="polite">
        <div><span id="withSpacesLabel">공백 포함</span><strong id="withSpaces">0자</strong><small id="withSpacesBytes">0 byte</small></div>
        <div><span id="withoutSpacesLabel">공백 제외</span><strong id="withoutSpaces">0자</strong><small id="withoutSpacesBytes">0 byte</small></div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
