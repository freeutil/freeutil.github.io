<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="인터넷에서 N년 떠돈 짤 만들기. JPG 이미지를 업로드하고 오래된 인터넷 이미지처럼 변환해보세요.">
  <title>Free Util · Meme Age</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://freeutil.github.io/memeAge/">
  <style>.hero h1{letter-spacing:-.03em}</style>
  <style>.brand-mark{width:18px;height:18px;border-radius:0;background:linear-gradient(var(--green) 0 0) 0 12px/6px 6px no-repeat,linear-gradient(var(--green) 0 0) 6px 6px/6px 6px no-repeat,linear-gradient(var(--green) 0 0) 12px 0/6px 6px no-repeat}</style>
  <style>.brand{gap:5px}</style>
  <style>:root{--line:#c3cdc5}</style>
  <style>.brand-mark{background:#e63946!important;clip-path:polygon(20% 0,40% 0,40% 20%,60% 20%,60% 0,80% 0,80% 20%,100% 20%,100% 60%,80% 60%,80% 80%,60% 80%,60% 100%,40% 100%,40% 80%,20% 80%,20% 60%,0 60%,0 20%,20% 20%);border-radius:0!important}</style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="../" aria-label="Free Util home"><span class="brand-mark" aria-hidden="true"></span> Free Util</a></header>
    <section class="hero"><h1 id="title">Meme Age</h1><p id="tagline">이미지를 업로드하고 인터넷을 오래 떠돈 것처럼 만들어보세요.</p></section>
    <section class="workspace">
      <div class="upload" id="dropZone"><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp"><h2 id="uploadTitle">이미지를 업로드하세요</h2><p id="uploadHint">지원 형식: JPG, PNG, WebP.<br>이미지 파일은 서버로 전송되지 않습니다.</p><button id="uploadButton" type="button">이미지 선택</button></div>
      <div class="controls" id="controls" hidden><label><span id="yearsLabel">인터넷에 떠돈 기간</span><output id="yearsValue">10년</output><input id="years" type="range" min="1" max="20" value="10"></label><button class="change-image" id="changeImageButton" type="button">이미지 변경</button></div>
      <div class="preview-grid" id="previewGrid" hidden><div><span id="originalLabel">원본 이미지</span><canvas id="originalCanvas"></canvas></div><div><span id="resultLabel">N년 떠돈 이미지</span><canvas id="resultCanvas"></canvas><button class="download" id="downloadButton" type="button">다운로드</button></div></div>
    </section>
    <footer><span>Free Util · <span id="footerText">간단하고 재미있는 이미지 도구</span></span><span id="privacyText">이미지는 브라우저 안에서만 처리됩니다.</span></footer>
  </main>
  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
